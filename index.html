<!DOCTYPE html>
<html lang="it"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Gestionale associazione</title>
<style>
:root{--bg:#faf8f5;--card:#fff;--tx:#2a2622;--mu:#7a7268;--ac:#b4532a;--bd:#e4ddd3;--ko:#b3261e;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1c1a18;--card:#26231f;--tx:#efe9e1;--mu:#a39a8e;--ac:#d9744a;--bd:#3a352f;--ko:#f2867d;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#1c1a18;--card:#26231f;--tx:#efe9e1;--mu:#a39a8e;--ac:#d9744a;--bd:#3a352f;--ko:#f2867d;color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif}
#app{max-width:980px;margin:0 auto;padding:12px}
header{display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:space-between}
h1{font-size:20px;margin:6px 0}h2{font-size:17px}h3{margin:0 0 10px;font-size:15px}
nav{display:flex;gap:6px;overflow-x:auto;padding:8px 0}
button{font:inherit;padding:8px 14px;border-radius:8px;border:0;background:var(--ac);color:#fff;cursor:pointer}
nav button{white-space:nowrap;background:var(--card);color:var(--tx);border:1px solid var(--bd)}
nav .on{background:var(--ac);color:#fff;border-color:var(--ac)}
button.sec,.sm{background:var(--card);color:var(--tx);border:1px solid var(--bd)}
.sm{padding:3px 9px;font-size:13px;margin-left:4px}.sm.ko{color:var(--ko)}
.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:14px;margin:10px 0}
.g{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px;margin-bottom:10px}
label{display:flex;flex-direction:column;font-size:13px;color:var(--mu);gap:3px}
input,select{font:inherit;padding:8px;border:1px solid var(--bd);border-radius:8px;background:var(--bg);color:var(--tx);width:100%}
.ck{flex-direction:row;align-items:center;gap:8px;color:var(--tx);font-size:15px;padding:6px 0}.ck input{width:auto}
.w{overflow-x:auto}table{border-collapse:collapse;width:100%}
th,td{text-align:left;padding:7px 8px;border-bottom:1px solid var(--bd);white-space:nowrap}
th{font-size:12px;color:var(--mu);text-transform:uppercase}
.a,.r{text-align:right}.mu{color:var(--mu)}.tot td{font-weight:700}.err{color:var(--ko)}
#ov{position:fixed;inset:0;background:var(--bg);padding:20px;overflow:auto;z-index:9}#ov:empty{display:none}
@media print{.np,nav,header{display:none!important}body.po #app{display:none}#ov{position:static}}
</style>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script></head><body>
<div id="app"></div><div id="ov"></div>
<datalist id="cats"><option value="Quota associativa"><option value="Quota corso"><option value="Donazione"><option value="Evento"><option value="Affitto sala"><option value="Compensi"><option value="Materiale"><option value="SIAE"><option value="Assicurazione"></datalist>
<script>
const $=s=>document.querySelector(s),esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const eur=n=>(+n||0).toLocaleString("it-IT",{style:"currency",currency:"EUR"}),dt=s=>s?s.split("-").reverse().join("/"):"",today=()=>new Date().toISOString().slice(0,10);
let db=null,ov="",err="",del=null,tab="soci",ed=null,yr=new Date().getFullYear(),pc="",pd=today(),stato="Archivio non disponibile: apri la pagina da claude.ai con il tuo account.";
const S={soci:[],corsi:[],iscrizioni:[],presenze:[],eventi:[],movimenti:[],config:[]},ready={};
const by=(c,id)=>S[c].find(x=>x.id===id),cfg=()=>S.config[0]||{};
const opt=(c,k)=>S[c].map(x=>[x.id,x[k]||""]).sort((a,b)=>a[1].localeCompare(b[1]));
const T=[["soci","Soci"],["corsi","Corsi"],["iscrizioni","Iscrizioni"],["presenze","Presenze"],["eventi","Eventi"],["movimenti","Prima nota"],["bilancio","Bilancio"]];
const E={
soci:{f:[["nome","Nome e cognome","text",1],["tel","Telefono","tel"],["email","Email","email"],["nascita","Data di nascita","date"],["iscritto","Data iscrizione","date"],["tessera","Anno tessera","number"],["note","Note","text"]],c:["nome","tel","email","tessera"]},
corsi:{f:[["nome","Nome corso","text",1],["quota","Quota (€)","number"],["giorno","Giorno e orario","text"],["note","Note","text"]],c:["nome","quota","giorno"]},
iscrizioni:{f:[["socio","Socio","select",1,()=>opt("soci","nome")],["corso","Corso","select",1,()=>opt("corsi","nome")],["data","Data","date"]],c:["socio","corso","data"]},
eventi:{f:[["titolo","Titolo","text",1],["data","Data","date"],["luogo","Luogo","text"],["note","Note","text"]],c:["titolo","data","luogo"]},
movimenti:{f:[["data","Data","date",1],["tipo","Tipo","select",1,()=>[["E","Entrata"],["U","Uscita"]]],["cat","Categoria","text",1],["importo","Importo (€)","number",1],["socio","Socio (facoltativo)","select",0,()=>[["","—"],...opt("soci","nome")]],["desc","Descrizione","text"]],c:["data","tipo","cat","importo","socio","ric"]}
};
const cell=(d,k)=>{const v=d[k];if(k==="socio")return esc(by("soci",v)?.nome||"—");if(k==="corso")return esc(by("corsi",v)?.nome||"—");
if(["data","nascita","iscritto"].includes(k))return dt(v);if(k==="importo"||k==="quota")return v===""||v==null?"":eur(v);if(k==="tipo")return v==="E"?"Entrata":"Uscita";return esc(v)};
function form(c){const e=E[c],d=ed&&ed.c===c?ed.d:{};
return `<div id="form" data-c="${c}"><h3>${d.id?"Modifica":"Nuovo inserimento"}</h3><div class="g">`+e.f.map(([k,l,ty,r,o])=>{const v=d[k]??(k==="data"&&!d.id?today():"");
return `<label>${l}`+(ty==="select"?`<select name="${k}" ${r?"required":""}>${r&&!v?'<option value="">Scegli…</option>':""}${o().map(([a,b])=>`<option value="${esc(a)}" ${a===v?"selected":""}>${esc(b)}</option>`).join("")}</select>`:`<input name="${k}" type="${ty}" value="${esc(v)}" ${r?"required":""} ${ty==="number"?'step="0.01"':""} ${k==="cat"?'list="cats"':""}>`)+`</label>`}).join("")+`</div><button data-a="save" data-c="${c}">Salva</button> ${d.id?'<button class="sec" data-a="cancel">Annulla</button>':""} <span class="err" id="fe"></span></div>`}
function table(c){const e=E[c],rows=[...S[c]].sort(c==="soci"||c==="corsi"?(a,b)=>(a.nome||"").localeCompare(b.nome||""):(a,b)=>(b.data||"").localeCompare(a.data||""));
const L=k=>(e.f.find(x=>x[0]===k)||[0,"Ricevuta"])[1];
return `<div class="card"><div class="w"><table><tr>${e.c.map(k=>`<th>${L(k)}</th>`).join("")}<th class="np"></th></tr>`+rows.map(d=>`<tr>${e.c.map(k=>`<td>${cell(d,k)}</td>`).join("")}<td class="np a">${c==="movimenti"&&d.ric?`<button class="sm" data-a="ric" data-i="${d.id}">Ricevuta</button>`:""}<button class="sm" data-a="edit" data-c="${c}" data-i="${d.id}">Modifica</button><button class="sm ko" data-a="del" data-c="${c}" data-i="${d.id}">${del===d.id?"Confermi?":"Elimina"}</button></td></tr>`).join("")+`</table></div>${rows.length?"":'<p class="mu">Ancora nulla qui.</p>'}</div>`}
function presenze(){const cs=opt("corsi","nome");if(!pc&&cs.length)pc=cs[0][0];
const isc=S.iscrizioni.filter(i=>i.corso===pc).map(i=>by("soci",i.socio)).filter(Boolean).sort((a,b)=>a.nome.localeCompare(b.nome)),rec=by("presenze",pc+"_"+pd)||{presenti:[]},tot=S.presenze.filter(p=>p.corso===pc);
return `<div class="card" id="pf"><div class="g"><label>Corso<select id="pc">${cs.map(([a,b])=>`<option value="${a}" ${a===pc?"selected":""}>${esc(b)}</option>`).join("")}</select></label><label>Data lezione<input type="date" id="pd" value="${pd}"></label></div>`+
(isc.length?isc.map(s=>`<label class="ck"><input type="checkbox" data-s="${s.id}" ${rec.presenti.includes(s.id)?"checked":""}> ${esc(s.nome)} <span class="mu">(${tot.filter(p=>p.presenti.includes(s.id)).length} presenze)</span></label>`).join(""):'<p class="mu">Nessun iscritto: crea prima il corso e aggiungi le iscrizioni.</p>')+`</div>`}
function bilancio(){const ys=[...new Set(S.movimenti.map(m=>(m.data||"").slice(0,4)).filter(Boolean).concat([""+yr]))].sort().reverse(),ms=S.movimenti.filter(m=>(m.data||"").startsWith(yr));
const g=t=>{const o={};ms.filter(m=>m.tipo===t).forEach(m=>o[m.cat]=(o[m.cat]||0)+(+m.importo||0));return o},sum=o=>Object.values(o).reduce((a,b)=>a+b,0),
blk=o=>Object.entries(o).sort().map(([k,v])=>`<tr><td>${esc(k)}</td><td class="r">${eur(v)}</td></tr>`).join(""),en=g("E"),us=g("U"),te=sum(en),tu=sum(us);
return `<div class="card"><div class="np"><label style="max-width:160px">Anno<select id="yr">${ys.map(y=>`<option ${y==yr?"selected":""}>${y}</option>`).join("")}</select></label></div><h2>${esc(cfg().nome||"Associazione")} — Rendiconto ${yr}</h2><div class="w"><table><tr><th>Entrate</th><th class="r">Importo</th></tr>${blk(en)}<tr class="tot"><td>Totale entrate</td><td class="r">${eur(te)}</td></tr><tr><th>Uscite</th><th></th></tr>${blk(us)}<tr class="tot"><td>Totale uscite</td><td class="r">${eur(tu)}</td></tr><tr class="tot"><td>Avanzo / disavanzo</td><td class="r">${eur(te-tu)}</td></tr></table></div>${ms.length?"":'<p class="mu">Nessun movimento in questo anno: compila la prima nota.</p>'}<p><button class="np" data-a="pdf" data-k="bil">Scarica PDF</button></p></div>`}
function view(){if(tab==="bilancio")return bilancio();if(tab==="presenze")return presenze();
return (tab==="soci"?`<p class="mu np">Tesserati ${yr}: ${S.soci.filter(s=>s.tessera===yr).length} su ${S.soci.length} soci</p>`:"")+`<div class="card np">${form(tab)}</div>`+table(tab)}
function render(){document.body.classList.toggle("po",!!ov);$("#ov").innerHTML=ov;
const m=!db?stato:(ready.soci?"":"Caricamento dati… (se resta così, i dati potrebbero non essere raggiungibili)");
$("#app").innerHTML=`<header><h1>📒 ${esc(cfg().nome||"Gestionale associazione")}</h1><label class="np" style="min-width:220px">Nome dell’associazione<input id="nm" value="${esc(cfg().nome||"")}"></label><button class="np sec" data-a="xls">Esporta in Excel</button></header><nav>${T.map(([k,l])=>`<button data-a="tab" data-t="${k}" class="${k===tab?"on":""}">${l}</button>`).join("")}</nav>${m?`<p class="mu">${m}</p>`:""}${err?`<p class="err">${esc(err)}</p>`:""}`+view()}
const draw=()=>{if(document.activeElement?.closest("#form,#pf,#nm"))return;render()};
async function save(c){const f=$("#form"),d={};let bad=0;f.querySelectorAll("[name]").forEach(x=>{d[x.name]=x.value;x.style.borderColor="";if(x.required&&!x.value){bad=1;x.style.borderColor="var(--ko)"}});if(bad){$("#fe").textContent="Compila i campi obbligatori.";return}E[c].f.forEach(([k,,ty])=>{if(ty==="number"&&k in d)d[k]=d[k]===""?"":+d[k]});
const id=ed&&ed.c===c&&ed.d.id;err="";
if(c==="movimenti"){if(d.tipo==="E"){const y=d.data.slice(0,4),old=id&&ed.d.ric;
if(old)d.ric=old;else{const n=Math.max(0,...S.movimenti.filter(m=>m.ric&&m.ric.startsWith(y+"/")).map(m=>+m.ric.split("/")[1]))+1;d.ric=y+"/"+String(n).padStart(4,"0")}}}
document.activeElement?.blur();
try{const col=db.collection(c);id?await col.doc(id).set(d):await col.add(d);ed=null}catch(e){err="Salvataggio non riuscito: "+(e.message||e.code||"errore")}
render()}
function showRic(i){ricId=i;const m=by("movimenti",i),s=by("soci",m.socio);
ov=`<div class="card"><h2>${esc(cfg().nome||"Associazione")}</h2><h3>Ricevuta n. ${esc(m.ric)}</h3><p>Data: ${dt(m.data)}</p><p>Ricevuto da: <b>${esc(s?s.nome:"—")}</b></p><p>Importo: <b>${eur(m.importo)}</b></p><p>Causale: ${esc(m.cat)}${m.desc?" — "+esc(m.desc):""}</p><p class="mu">Firma ______________________</p></div><p><button class="np" data-a="pdf" data-k="ric">Scarica PDF</button> <button class="np sec" data-a="closeov">Chiudi</button></p>`}
let ricId="";const num=n=>(+n||0).toLocaleString("it-IT",{minimumFractionDigits:2,maximumFractionDigits:2})+" EUR";
async function pdf(name,rows){err="";try{const dl=await window.claude?.use("downloads"),J=window.jspdf;if(!dl||!J){err="Il PDF non è disponibile in questa vista.";return render()}
const d=new J.jsPDF();let y=20;rows.forEach(([a,b,bold,sz])=>{sz=sz||11;d.setFont("helvetica",bold?"bold":"normal");d.setFontSize(sz);d.splitTextToSize(String(a),b==null?170:125).forEach((t,i)=>{if(y>280){d.addPage();y=20}d.text(t,20,y);if(i===0&&b!=null)d.text(String(b),190,y,{align:"right"});y+=sz*0.5+3})});
await dl.save({filename:name,data:d.output("arraybuffer")})}catch(e){if(e&&e.code!=="declined")err="PDF non riuscito ("+(e.code||e.message)+")"}render()}
function pdfBil(){const nm=cfg().nome||"Associazione",ms=S.movimenti.filter(m=>(m.data||"").startsWith(yr)),r=[[nm,null,1,16],["Rendiconto "+yr,null,0,12],[" ",null],],t={};
[["E","Entrate"],["U","Uscite"]].forEach(([k,l])=>{const o={};ms.filter(m=>m.tipo===k).forEach(m=>o[m.cat]=(o[m.cat]||0)+(+m.importo||0));r.push([l.toUpperCase(),"",1,12]);Object.entries(o).sort().forEach(([c,v])=>r.push([c,num(v)]));t[k]=Object.values(o).reduce((a,b)=>a+b,0);r.push(["Totale "+l.toLowerCase(),num(t[k]),1],[" ",null])});
r.push(["Avanzo / disavanzo",num(t.E-t.U),1,12]);return pdf("bilancio-"+yr+".pdf",r)}
function pdfRic(){const m=by("movimenti",ricId);if(!m)return;const s=by("soci",m.socio);return pdf("ricevuta-"+m.ric.replace("/","-")+".pdf",[[cfg().nome||"Associazione",null,1,16],["Ricevuta n. "+m.ric,null,1,13],[" ",null],["Data: "+dt(m.data),null],["Ricevuto da: "+(s?s.nome:"-"),null],["Importo: "+num(m.importo),null,1],["Causale: "+m.cat+(m.desc?" - "+m.desc:""),null],[" ",null],["Firma ______________________",null]])}
const cv=(d,k)=>{const v=d[k];if(k==="socio")return by("soci",v)?.nome||"";if(k==="corso")return by("corsi",v)?.nome||"";if(k==="tipo")return v==="E"?"Entrata":"Uscita";if(["data","nascita","iscritto"].includes(k))return dt(v);return v??""};
async function esporta(){err="";
try{const dl=await window.claude?.use("downloads");if(!dl||!window.XLSX){err="Esportazione non disponibile in questa vista.";return render()}
const wb=XLSX.utils.book_new(),add=(n,r)=>XLSX.utils.book_append_sheet(wb,XLSX.utils.json_to_sheet(r.length?r:[{}]),n),nm={soci:"Soci",corsi:"Corsi",iscrizioni:"Iscrizioni",eventi:"Eventi",movimenti:"Prima nota"};
Object.keys(nm).forEach(c=>{const ks=E[c].f.map(x=>x[0]).concat(c==="movimenti"?["ric"]:[]),L=k=>(E[c].f.find(x=>x[0]===k)||[0,"Ricevuta"])[1];
const rows=S[c].slice().sort((a,b)=>(a.data||a.nome||"").localeCompare(b.data||b.nome||""));
add(nm[c],rows.map(d=>{const o={};ks.forEach(k=>o[L(k)]=["importo","quota","tessera"].includes(k)?(d[k]===""?"":d[k]):cv(d,k));return o}))});
add("Presenze",S.presenze.flatMap(p=>(p.presenti||[]).map(s=>({iso:p.data,Data:dt(p.data),Corso:by("corsi",p.corso)?.nome||"",Socio:by("soci",s)?.nome||""}))).sort((a,b)=>a.iso.localeCompare(b.iso)).map(({iso,...o})=>o));
const ms=S.movimenti.filter(m=>(m.data||"").startsWith(yr)),r=[],tot={};
[["E","Entrate"],["U","Uscite"]].forEach(([t,l])=>{const o={};ms.filter(m=>m.tipo===t).forEach(m=>o[m.cat]=(o[m.cat]||0)+(+m.importo||0));r.push({Voce:l.toUpperCase(),Importo:""});Object.entries(o).sort().forEach(([k,v])=>r.push({Voce:k,Importo:v}));tot[t]=Object.values(o).reduce((a,b)=>a+b,0);r.push({Voce:"Totale "+l.toLowerCase(),Importo:tot[t]})});
r.push({Voce:"Avanzo / disavanzo",Importo:tot.E-tot.U});add("Bilancio "+yr,r);
await dl.save({filename:"gestionale-"+yr+".xlsx",data:XLSX.write(wb,{type:"array",bookType:"xlsx"})})}
catch(e){if(e&&e.code!=="declined")err="Esportazione non riuscita ("+(e.code||e.message)+")"}
render()}
document.addEventListener("click",async e=>{const b=e.target.closest("[data-a]");if(!b)return;const a=b.dataset.a,c=b.dataset.c,i=b.dataset.i;if(a!=="del")del=null;
if(a==="tab"){tab=b.dataset.t;ed=null;err=""}
else if(a==="edit"){ed={c,d:by(c,i)};scrollTo(0,0)}
else if(a==="del"){if(del===i){del=null;try{await db.collection(c).doc(i).delete()}catch(x){err="Eliminazione non riuscita"}}else del=i}
else if(a==="cancel")ed=null;else if(a==="ric")showRic(i);else if(a==="closeov")ov="";else if(a==="pdf")return b.dataset.k==="ric"?pdfRic():pdfBil();else if(a==="xls")return esporta();else if(a==="save")return save(c);
render()});
document.addEventListener("keydown",e=>{if(e.key==="Enter"&&e.target.tagName==="INPUT"&&e.target.closest("#form"))save($("#form").dataset.c)});
document.addEventListener("change",e=>{const t=e.target;if(!db)return;
if(t.id==="nm"){t.blur();db.collection("config").doc("main").set({nome:t.value})}
else if(t.id==="pc"){pc=t.value;t.blur();render()}
else if(t.id==="pd"){pd=t.value||pd;t.blur();render()}
else if(t.id==="yr"){yr=+t.value;t.blur();render()}
else if(t.dataset.s){const id=pc+"_"+pd,r=by("presenze",id),l=new Set(r?r.presenti:[]);t.checked?l.add(t.dataset.s):l.delete(t.dataset.s);t.blur();db.collection("presenze").doc(id).set({corso:pc,data:pd,presenti:[...l]})}});
function sub(c){db.collection(c).onSnapshot(s=>{S[c]=s.docs.map(x=>({...(typeof x.data==="function"?x.data():x.data),id:x.id}));ready[c]=1;draw()},e=>{err="Errore di lettura dati ("+(e.code||e.message)+")";render()})}
render();
(async()=>{try{db=await window.claude?.use("db")}catch(e){db=null}
if(db)Object.keys(S).forEach(sub);render()})();
</script></body></html>
